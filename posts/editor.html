:root{--grafite:#414141;--vinho:#431F2B;--salvia:#D3DDD2;--rosa:#F6C7BF;--off:#FDFFFA;--salvia-esc:#9fb09d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito Sans',system-ui,sans-serif;background:#eef1ec;color:var(--grafite);display:grid;grid-template-columns:360px 1fr;min-height:100vh}
/* ---------- painel ---------- */
.painel{background:#fff;padding:22px;border-right:1px solid var(--salvia);overflow:auto;max-height:100vh;position:sticky;top:0}
.painel h1{font-family:'Fraunces',serif;color:var(--vinho);font-size:1.35rem;margin-bottom:4px}
.painel .sub{font-size:.85rem;margin-bottom:18px;color:#777}
.painel label{display:block;font-size:.78rem;font-weight:700;color:var(--vinho);margin:14px 0 5px;text-transform:uppercase;letter-spacing:.04em}
.painel input[type=text],.painel textarea,.painel select{width:100%;font:inherit;font-size:.95rem;padding:9px 11px;border:1.5px solid var(--salvia);border-radius:10px;background:var(--off)}
.painel textarea{min-height:90px;resize:vertical}
.painel .dica{font-size:.75rem;color:#888;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:inherit;font-size:.82rem;border:1.5px solid var(--salvia);background:var(--off);border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--vinho)}
.chips button.on{background:var(--vinho);color:#fff;border-color:var(--vinho)}
.cores button{width:34px;height:34px;padding:0;border-radius:50%}
.cores button.on{outline:3px solid var(--vinho);outline-offset:2px}
.baixar{margin-top:22px;width:100%;font:inherit;font-weight:700;background:var(--vinho);color:#fff;border:0;border-radius:999px;padding:13px;cursor:pointer;font-size:1rem}
.baixar.sec{background:transparent;color:var(--vinho);border:1.5px solid var(--vinho);margin-top:10px}
.campo[hidden]{display:none}
/* ---------- palco ---------- */
.palco{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;gap:14px}
.palco .tam{font-size:.8rem;color:#888}
.escala{transform-origin:top left}
/* ---------- POST ---------- */
.post{width:1080px;height:1350px;position:relative;overflow:hidden;font-family:'Nunito Sans',sans-serif;display:flex;flex-direction:column;padding:110px 100px 90px}
.post.f-quadrado{height:1080px;padding:90px 96px 80px}
.post.f-stories{height:1920px;padding:240px 100px 260px}
.post .arcos{position:absolute;width:820px;right:-180px;bottom:-40px;opacity:.55;pointer-events:none}
.post .arcos path{fill:none;stroke-width:16;stroke-linecap:round}
.post .det{font-family:'Caveat',cursive;font-size:62px;line-height:1;margin-bottom:26px}
.post .titulo{font-family:'Fraunces',serif;font-weight:600;font-size:96px;line-height:1.06;letter-spacing:-.01em}
.post .titulo em{font-style:italic;font-weight:500}
.post .texto{font-size:40px;line-height:1.5;margin-top:38px;max-width:860px}
.post .lista{list-style:none;margin-top:46px;display:flex;flex-direction:column;gap:26px;position:relative;z-index:1}
.post .lista li{font-size:40px;line-height:1.4;padding:26px 34px 26px 96px;border-radius:28px;position:relative}
.post .lista li b.n{position:absolute;left:30px;top:20px;font-family:'Fraunces',serif;font-size:52px;line-height:1}
.post .rodape{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;position:relative;z-index:1}
.post .rodape img{height:118px}
.post .arroba{font-size:30px;font-weight:700;letter-spacing:.02em}
.post .seta{font-size:30px;font-weight:700;display:flex;align-items:center;gap:12px}
.post .frase{font-family:'Fraunces',serif;font-style:italic;font-weight:500;font-size:84px;line-height:1.18;margin-top:auto}
.post .aspas{font-family:'Fraunces',serif;font-size:260px;line-height:.6;height:120px;opacity:.6}
.post .foto{position:absolute;right:90px;top:120px;width:430px;aspect-ratio:4/5}
.post .foto::before{content:"";position:absolute;inset:22px -22px -22px 22px;border-radius:220px 220px 30px 30px}
.post .foto img{position:relative;width:100%;height:100%;object-fit:cover;border-radius:220px 220px 30px 30px}
.post .cta{display:inline-block;margin-top:46px;font-weight:700;font-size:38px;padding:24px 44px;border-radius:999px}
.post .num{position:absolute;top:70px;right:90px;font-family:'Fraunces',serif;font-size:34px;font-weight:600;opacity:.7}
.post .logo-centro{height:190px;margin-bottom:50px}
/* temas */
.t-off{background:var(--off);color:var(--grafite)} .t-off .titulo,.t-off .frase,.t-off .aspas{color:var(--vinho)} .t-off .det{color:var(--salvia-esc)} .t-off .arcos path{stroke:var(--salvia)} .t-off .lista li{background:var(--salvia);color:var(--grafite)} .t-off .lista b.n{color:var(--vinho)} .t-off .arroba,.t-off .seta{color:var(--vinho)} .t-off .foto::before{background:var(--salvia)} .t-off .cta{background:var(--vinho);color:var(--off)}
.t-salvia{background:var(--salvia);color:var(--grafite)} .t-salvia .titulo,.t-salvia .frase,.t-salvia .aspas{color:var(--vinho)} .t-salvia .det{color:#6f8a6c} .t-salvia .arcos path{stroke:var(--off)} .t-salvia .lista li{background:var(--off)} .t-salvia .lista b.n{color:#e79b8e} .t-salvia .arroba,.t-salvia .seta{color:var(--vinho)} .t-salvia .foto::before{background:var(--rosa)} .t-salvia .cta{background:var(--vinho);color:var(--off)}
.t-rosa{background:var(--rosa);color:var(--grafite)} .t-rosa .titulo,.t-rosa .frase,.t-rosa .aspas{color:var(--vinho)} .t-rosa .det{color:var(--vinho);opacity:.75} .t-rosa .arcos path{stroke:var(--off)} .t-rosa .lista li{background:var(--off)} .t-rosa .lista b.n{color:var(--vinho)} .t-rosa .arroba,.t-rosa .seta{color:var(--vinho)} .t-rosa .foto::before{background:var(--salvia)} .t-rosa .cta{background:var(--vinho);color:var(--off)}
.t-vinho{background:var(--vinho);color:var(--off)} .t-vinho .titulo,.t-vinho .frase{color:var(--off)} .t-vinho .aspas{color:var(--rosa)} .t-vinho .det{color:var(--rosa)} .t-vinho .arcos path{stroke:#5c3341} .t-vinho .lista li{background:#5a2a3a;color:var(--off)} .t-vinho .lista b.n{color:var(--rosa)} .t-vinho .arroba,.t-vinho .seta{color:var(--rosa)} .t-vinho .foto::before{background:var(--rosa)} .t-vinho .cta{background:var(--rosa);color:var(--vinho)} .t-vinho .rodape img{filter:brightness(0) invert(1)}
@media(max-width:900px){body{grid-template-columns:1fr}.painel{position:static;max-height:none}}
</style>
</head>
<body>
<aside class="painel">
  <h1>Editor de posts</h1>
  <p class="sub">Escolha o modelo, escreva o texto e baixe o PNG pronto para o Instagram.</p>

  <label>Modelo</label>
  <div class="chips" id="modelos">
    <button data-m="capa" class="on">Capa</button>
    <button data-m="texto">Texto</button>
    <button data-m="lista">Lista / dicas</button>
    <button data-m="frase">Frase</button>
    <button data-m="sobre">Quem sou eu</button>
    <button data-m="final">Final / agendar</button>
  </div>

  <label>Formato</label>
  <div class="chips" id="formatos">
    <button data-f="retrato" class="on">Feed 4:5</button>
    <button data-f="quadrado">Quadrado</button>
    <button data-f="stories">Stories</button>
  </div>

  <label>Cor de fundo</label>
  <div class="chips cores" id="temas">
    <button data-t="off" class="on" style="background:#FDFFFA" title="Off-white"></button>
    <button data-t="salvia" style="background:#D3DDD2" title="Sálvia"></button>
    <button data-t="rosa" style="background:#F6C7BF" title="Rosa"></button>
    <button data-t="vinho" style="background:#431F2B" title="Vinho"></button>
  </div>

  <div class="campo" data-c="det"><label>Detalhe manuscrito</label><input type="text" id="i-det" value="psiquiatria infantil"></div>
  <div class="campo" data-c="titulo"><label>Título</label><textarea id="i-titulo">Birra ou algo mais?</textarea><p class="dica">Use *asteriscos* para deixar uma palavra em itálico.</p></div>
  <div class="campo" data-c="texto"><label>Texto</label><textarea id="i-texto">Toda criança tem momentos difíceis. O que importa é a frequência, a intensidade e o quanto isso atrapalha a vida dela.</textarea></div>
  <div class="campo" data-c="lista"><label>Itens (um por linha)</label><textarea id="i-lista">Crises muito frequentes ou intensas
Dificuldade de se acalmar mesmo com ajuda
Prejuízo na escola ou nas amizades
Mudança brusca de comportamento</textarea></div>
  <div class="campo" data-c="frase"><label>Frase</label><textarea id="i-frase">Talvez a pergunta mais importante não seja “O que meu filho tem?”, mas “Do que meu filho precisa?”</textarea></div>
  <div class="campo" data-c="cta"><label>Botão</label><input type="text" id="i-cta" value="Agende pelo link da bio"></div>
  <div class="campo" data-c="num"><label>Número do slide (opcional)</label><input type="text" id="i-num" placeholder="ex.: 2/5"></div>
  <div class="campo" data-c="seta"><label>Chamada do rodapé</label><input type="text" id="i-seta" value="arraste para o lado →"></div>
  <label>Arroba</label><input type="text" id="i-arroba" value="@queridapsiquiatria">

  <button class="baixar" id="baixar">Baixar PNG</button>
  <button class="baixar sec" id="dup">Salvar como próximo slide</button>
  <p class="dica" style="margin-top:10px">Dica para carrossel: mantenha a mesma cor de fundo ou alterne entre duas, e numere os slides.</p>
</aside>

<main class="palco">
  <div id="moldura"><div class="escala" id="escala"><div class="post t-off" id="post"></div></div></div>
  <p class="tam" id="tam">1080 × 1350 px</p>

const ARCOS='<svg class="arcos" viewBox="0 0 600 320"><path d="M60 310V200a240 190 0 0 1 480 0v110"/><path d="M140 310V210a160 130 0 0 1 320 0v100"/><path d="M220 310V225a80 75 0 0 1 160 0v85"/></svg>';
const CAMPOS={capa:['det','titulo','num','seta'],texto:['det','titulo','texto','num','seta'],lista:['det','titulo','lista','num','seta'],frase:['frase','num'],sobre:['det','titulo','texto','num'],final:['titulo','texto','cta']};
const st={m:'capa',f:'retrato',t:'off',slide:1};
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt=s=>esc(s).replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/\n/g,'<br>');
function chips(id,key){$(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;[...$(id).children].forEach(x=>x.classList.remove('on'));b.classList.add('on');st[key]=b.dataset[key];render()})}
chips('modelos','m');chips('formatos','f');chips('temas','t');
document.querySelectorAll('input,textarea').forEach(el=>el.addEventListener('input',render));
function v(id){return $('i-'+id).value.trim()}
function render(){
  document.querySelectorAll('.campo').forEach(c=>c.hidden=!CAMPOS[st.m].includes(c.dataset.c));
  const p=$('post');p.className='post t-'+st.t+(st.f!=='retrato'?' f-'+st.f:'');
  const det=v('det')?`<div class="det">${esc(v('det'))}</div>`:'';
  const num=v('num')?`<div class="num">${esc(v('num'))}</div>`:'';
  const seta=v('seta')?`<span class="seta">${esc(v('seta'))}</span>`:'<span></span>';
  const rod=(dir)=>`<div class="rodape"><span class="arroba">${esc(v('arroba'))}</span>${dir}</div>`;
  let h=ARCOS+num;
  if(st.m==='capa') h+=`<div style="margin-top:auto;margin-bottom:auto;position:relative;z-index:1">${det}<div class="titulo" style="font-size:118px">${fmt(v('titulo'))}</div></div>`+rod(seta);
  if(st.m==='texto') h+=`<div style="position:relative;z-index:1">${det}<div class="titulo">${fmt(v('titulo'))}</div><p class="texto">${fmt(v('texto'))}</p></div>`+rod(seta);
  if(st.m==='lista') h+=`${det}<div class="titulo" style="font-size:84px;position:relative;z-index:1">${fmt(v('titulo'))}</div><ul class="lista">${v('lista').split('\n').filter(Boolean).map((x,i)=>`<li><b class="n">${i+1}</b>${fmt(x)}</li>`).join('')}</ul>`+rod(seta);
  if(st.m==='frase') h+=`<div class="aspas">“</div><div class="frase" style="margin-bottom:auto;position:relative;z-index:1">${fmt(v('frase'))}</div>`+rod(`<img src="${LOGO}" alt="">`);
  if(st.m==='sobre') h+=`<div class="foto"><img src="${FOTO}" alt=""></div><div style="margin-top:${st.f==='quadrado'?500:600}px;position:relative;z-index:1">${det}<div class="titulo" style="font-size:80px">${fmt(v('titulo'))}</div><p class="texto" style="font-size:36px;margin-top:24px">${fmt(v('texto'))}</p></div>`+rod('');
  if(st.m==='final') h+=`<div style="margin:auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;position:relative;z-index:1"><img class="logo-centro" src="${LOGO}" alt="" style="${st.t==='vinho'?'filter:brightness(0) invert(1)':''}"><div class="titulo" style="font-size:80px">${fmt(v('titulo'))}</div><p class="texto" style="margin-left:auto;margin-right:auto">${fmt(v('texto'))}</p><span class="cta">${esc(v('cta'))}</span></div><div class="rodape" style="justify-content:center"><span class="arroba">${esc(v('arroba'))}</span></div>`;
  p.innerHTML=h;
  const H={retrato:1350,quadrado:1080,stories:1920}[st.f];
  $('tam').textContent='1080 × '+H+' px · prévia reduzida';
  const k=Math.min((innerWidth>900?innerWidth-420:innerWidth-40)/1080,(innerHeight-90)/H,1);
  $('escala').style.transform=`scale(${k})`;$('moldura').style.width=1080*k+'px';$('moldura').style.height=H*k+'px';
}
addEventListener('resize',render);
const DEFAULTS={
  capa:{det:'psiquiatria infantil',titulo:'Birra ou *algo mais?*'},
  texto:{det:'vamos conversar',titulo:'Nem toda birra é um problema',texto:'Toda criança tem momentos difíceis. O que importa é a frequência, a intensidade e o quanto isso atrapalha a vida dela.'},
  lista:{det:'fique atento',titulo:'Quando procurar ajuda?'},
  sobre:{det:'quem cuida',titulo:'Prazer, sou a Dra. Mariana Aquino',texto:'Pediatra com pós-graduação em Psiquiatria da Infância e Adolescência. Atendo no Largo do Machado e na Barra da Tijuca.'},
  final:{titulo:'Seu filho precisa de um olhar cuidadoso?',texto:'Consultas no Largo do Machado e na Barra da Tijuca.'}
};
$('modelos').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=DEFAULTS[b.dataset.m]||{};Object.entries(d).forEach(([k,val])=>$('i-'+k).value=val);render()},true);
async function baixar(){
  await document.fonts.ready;
  const H={retrato:1350,quadrado:1080,stories:1920}[st.f];
  const p=$('post'),s=$('escala').style.transform;$('escala').style.transform='none';
  try{const url=await htmlToImage.toPng(p,{width:1080,height:H,pixelRatio:1,cacheBust:true});
    const a=document.createElement('a');a.download=`post-${st.slide}-${st.m}.png`;a.href=url;a.click();}
  catch(e){alert('Não consegui gerar a imagem. Abra o arquivo no Chrome com internet ligada e tente de novo.');}
  finally{$('escala').style.transform=s;}
}
$('baixar').onclick=baixar;
$('dup').onclick=async()=>{await baixar();st.slide++;$('i-num').value='';};
render();
</script>
